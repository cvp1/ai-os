# AI-OS installer build manifest (consumed by tools/build_installer.py)
version: "2026.08.03a"   # stamped into index.html + guide.html + the installer's UPGRADE-MODE header
prompt_bytes: 74689          # BUILD-COMPUTED — never hand-edit; build_installer.py overwrites on every run
prompt_sha256: "366aaca3150ba55c7e7345badcf002f417f61ff10d5a29a3d0ab0153e864f156"        # BUILD-COMPUTED — sha256 of ai-os-setup-prompt.txt's exact bytes; read by /update to verify its fetch
shell: core/shell.html
prompt:
  before: core/sections/before-skills.txt
  skills_glob: core/skills/*.md   # ordered by frontmatter 'order'
  after: core/sections/after-skills.txt
  join: "\n\n"
prompt2: core/second-act/career.txt
prompt3: core/second-act/scheduler.txt
prompt4: core/second-act/projects.txt
prompt5: core/second-act/learning.txt

# Outcome notes (FL-1a) — surfaced by /aios-doctor CURRENCY, filtered to what the user has.
# --------------------------------------------------------------------------------
# SILENT-SHIP IS THE DEFAULT. Add an entry ONLY when a change is invisible-unless-named:
#   • a NEW command the user would only get by upgrading, OR
#   • a re-paste-required upgrade to a command they already have, OR
#   • a change to trust posture / memory semantics (ALWAYS named).
# Habit-free improvements (faster model, better recall, internal refactors) ship SILENT —
# no entry. Most builds add NO entry: an over-full list recreates the announcement fatigue
# this feature exists to avoid.
# HONESTY: never describe a capability the build does not actually add. One cost-phrased
# sentence per entry, addressed to the user ("your…", "you can now…").
# FILTER KEYS: build = the build the change landed in (so /aios-doctor shows it only to users
# behind it); command = the command it concerns; scope = core | optin (an `optin` note is
# shown ONLY to users who installed that command — a user without /projects never sees a
# /projects note).
#
# Template for the first live entry (author it when the next invisible-unless-named change
# ships — e.g. when /sync graduates from dogfood):
#   - build: "YYYY.MM.DDx"
#     command: sync
#     scope: core
#     note: "your AI-OS can now live on more than one computer — /sync keeps your memory, notes and skills the same on each."
outcomes:
  - build: "2026.08.03a"
    command: local
    scope: core
    note: "your AI-OS can now keep working when the internet can't — /local sets up a small model on your own machine as a measured, gated failover floor, so essential automated work degrades instead of dying."
  - build: "2026.07.02b"
    command: capture
    scope: core
    note: "your AI-OS can now close a working session for you — /capture files what you decided to your notes and what you learned to your memory, so a session that mattered doesn't evaporate."
  - build: "2026.07.05b"
    command: improve
    scope: core
    note: "Sasha now keeps who-you-are in two plain files you can open and edit — me/WHOAMI.md and me/HOW-I-WORK.md. New setups meet a 5-question hello instead of a 19-question interview; re-pasting this installer adds the me/ files to an existing setup from what it already knows."
  - build: "2026.07.05f"
    command: weekly
    scope: core
    note: "/weekly now shows a monthly 'Sharper this month' mirror — how it got sharper at your work, and it stays silent when there's nothing real to show"
  - build: "2026.07.06a"
    command: improve
    scope: core
    note: "/improve now notices when you've corrected it the same way a few times and PROPOSES a standing rule so you stop repeating yourself — you always accept, edit, or reject it; nothing is written without your yes."
  - build: "2026.07.06b"
    command: aios-doctor
    scope: core
    note: "/aios-doctor now also checks your standing work — if you've scheduled a manager to draft between sessions, it tells you when a scheduled run has quietly stopped, so a silently-skipped automation can't fool you into thinking it's still working."
  - build: "2026.07.06b"
    command: projects
    scope: optin
    note: "/projects can now check in on its own — put `/projects check-in` on a schedule and it drafts your due status update while you're away, staged for you to send; /aios-doctor warns you if a scheduled check-in ever stops. Nothing is sent without you."
  - build: "2026.07.06c"
    command: gift
    scope: core
    note: "you can now give a capability you've proven to a friend — /gift packages it as one de-personalized file you can both read, and safely adopts one a friend sends you: their Sasha reviews it out loud and installs only after an explicit yes. No registry, no tracking — a gift is just a file."
  - build: "2026.07.11a"
    command: improve
    scope: core
    note: "your assistant's ground rules are now explicitly yours — setup asks how much it may do without asking (one test: can it be undone, and who can see it?), how hard it pushes back when it thinks you're wrong, what it protects for you unprompted (a sleep window, family dates, a budget line), and even its name; your answers live in me/HOW-I-WORK.md where you can edit them anytime, and it never changes its own rules without your plain-language OK."
  - build: "2026.07.12a"
    command: aios-doctor
    scope: core
    note: "if something was done for you while you were away — a status update drafted, or a scheduled check-in that quietly stopped — you'll hear about it once when you sit down, instead of having to run the right command to discover it. At most one thing, only when you're already here, never between sessions, and nothing at all when nothing is waiting."
  - build: "2026.07.13a"
    command: update
    scope: core
    note: "if you have Playwright MCP connected, you no longer have to open a browser to stay current — /update fetches the latest setup prompt, verifies it's genuine, and hands it to the same safe upgrade mode as always. Without Playwright connected, it tells you plainly and points you at pasting the prompt yourself, same as today. /aios-doctor still tells you when you're behind."
  - build: "2026.07.29a"
    command: aios-doctor
    scope: core
    note: "your checkup command is now /aios-doctor — it used to be /doctor, which is also the name of one of Claude Code's own commands, so typing it ran the platform's health check instead of yours and told you everything was fine about a system it never looked at. Same command, unambiguous name; upgrading shows you the old folder and asks before removing it."
  - build: "2026.07.29a"
    command: status-update
    scope: core
    note: "your status-update command is now /status-update — it used to be /status, which is also one of Claude Code's own commands, so typing it showed you the app's version and account instead of drafting your project update. Same command, and the new name says what it does."
